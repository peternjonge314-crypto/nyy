<text x="291" y="207" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.2" fill="#928E89">TUESDAY, OCTOBER 14</text>
<text x="291" y="252" font-family="Georgia,serif" font-size="25" fill="#343336">A small pause.</text>
<text x="291" y="280" font-family="Arial,sans-serif" font-size="10" fill="#77736D">What felt good today?</text>
<rect x="290" y="302" width="178" height="94" rx="7" fill="#E6E1EF"/><text x="305" y="327" font-family="Arial,sans-serif" font-size="9" fill="#6C6873">I took the long walk home,</text><text x="305" y="344" font-family="Arial,sans-serif" font-size="9" fill="#6C6873">and noticed all the little</text><text x="305" y="361" font-family="Arial,sans-serif" font-size="9" fill="#6C6873">yellow flowers in the cracks.</text><text x="305" y="382" font-family="Arial,sans-serif" font-size="8" fill="#A19AAE">Add a thought…</text>
<text x="291" y="428" font-family="Arial,sans-serif" font-size="8" letter-spacing="1" fill="#928E89">A MOMENT TO KEEP</text>
<rect x="290" y="443" width="178" height="57" rx="6" fill="#D7E0D1"/><circle cx="316" cy="471" r="13" fill="#E6BF70"/><text x="339" y="468" font-family="Georgia,serif" font-size="10" fill="#45463F">The air smelled</text><text x="339" y="482" font-family="Georgia,serif" font-size="10" fill="#45463F">like rain.</text>
<rect x="548" y="154" width="191" height="370" rx="26" fill="#29282C"/>
<rect x="557" y="164" width="173" height="352" rx="19" fill="#F7F3EB"/><rect x="601" y="173" width="85" height="13" rx="7" fill="#29282C"/>
<text x="578" y="220" font-family="Georgia,serif" font-size="16" fill="#343336">Your week, gently.</text>
<text x="578" y="249" font-family="Arial,sans-serif" font-size="8" fill="#928E89">A few moments you saved</text>
<rect x="577" y="270" width="133" height="72" rx="5" fill="#E7DFB4"/><text x="590" y="296" font-family="Georgia,serif" font-size="11" fill="#45463F">Sunday light</text><text x="590" y="314" font-family="Arial,sans-serif" font-size="8" fill="#7E7761">A moment to keep</text>
<rect x="577" y="354" width="133" height="72" rx="5" fill="#D7E0D1"/><text x="590" y="380" font-family="Georgia,serif" font-size="11" fill="#45463F">A good cup</text><text x="590" y="398" font-family="Arial,sans-serif" font-size="8" fill="#7E7761">A moment to keep</text>
<rect x="577" y="438" width="133" height="56" rx="5" fill="#E6E1EF"/><text x="590" y="471" font-family="Georgia,serif" font-size="10" fill="#45463F">Your reflections ↗</text>
